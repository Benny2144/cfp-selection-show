name: Quality gate

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Parse and contract checks
        run: pnpm run check

      - name: Workers runtime tests
        run: pnpm test

      - name: Production build
        run: pnpm run build

      - name: Validate generated bindings
        run: pnpm exec wrangler types /tmp/cfp-worker-bindings.d.ts

      - name: Validate Cloudflare bundle
        run: pnpm run deploy:check

      - name: Audit production dependencies
        run: pnpm audit --prod
